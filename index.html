<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" > 

<head>

<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>




<body>

   <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
   <!-- Web page content goes inside Bootstrap container(s) -->

<div class="container p-5 my-5 bg-primary bg-gradient  text-white">
  
  <h1>Hello, GitHub! I'm Charlie </h1>
  <p>This is my first web page using version control with Git and GitHub.</p>
  <p>I am learning to edit and version websites using VS Code, Git, and GitHub.</p>
<button type="button" class="btn btn-info ">More Info!</button>

  </div>




   <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>
</body>
